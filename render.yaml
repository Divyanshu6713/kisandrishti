# Render Blueprint — deploys Kisan Drishti as a static site (no Python, no server).
services:
  - type: web
    name: kisan-drishti
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      # Single-page app: any path that is not a real file (e.g. /app/organic) serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
